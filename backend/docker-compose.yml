version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: fastapi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "5433:5432" # Mapped to host port 5433 to avoid conflicts with host PostgreSQL on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=FastAPI Production Starter
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - DEBUG=True
      - ENVIRONMENT=production
      - SECRET_KEY=docker_production_secret_key_change_me_in_prod_32chars
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/app_db
      - CORS_ORIGINS=["*"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
